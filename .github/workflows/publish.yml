# Publishes a tagged release to Packagist. Manual only: Actions tab > "Publish to Packagist" > Run workflow.
# Only dudox can run it, and only while the repo variable PACKAGIST_PUBLISH_ENABLED=true.
#
# Packagist reads versions from the repo's tags and lists them by tag name (v0.1.0-beta.1, with the v), so "publishing" means telling Packagist to read the new
# tag. The Packagist package must NOT have the GitHub auto-update hook, or every tag would go out unchecked.
# ketapay/ketapay-php must be on Packagist first: this package requires it.
#
# The publish job runs in the `publish` environment, which needs dudox's approval before it starts.
# Auth: PACKAGIST_TOKEN (the Safe API Token of the Packagist account "ketapay") from Infisical (ketapay-sdks, prod).
name: Publish to Packagist

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, like v0.1.0-beta.1 (empty = the latest release)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Who, what and whether
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Only dudox can publish, and only when publishing is enabled
        env:
          ACTOR: ${{ github.actor }}
          ENABLED: ${{ vars.PACKAGIST_PUBLISH_ENABLED }}
        run: |
          if [ "$ACTOR" != "dudox" ]; then echo "::error::Only dudox can publish to Packagist ($ACTOR tried)."; exit 1; fi
          if [ "$ENABLED" != "true" ]; then echo "::error::Publishing is switched off (PACKAGIST_PUBLISH_ENABLED is not true)."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --json tagName -q .tagName)}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::No tag $tag."; exit 1; fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then echo "::error::$tag is not on main."; exit 1; fi
          version=$(git show "$tag:version.txt" | tr -d '[:space:]')
          if [ "$tag" != "v$version" ]; then echo "::error::$tag does not match version.txt $version."; exit 1; fi
          if git show "$tag:composer.json" | grep -q '"type": "path"'; then
            echo "::error::composer.json still reads ketapay-php from a path repository. Remove it once ketapay/ketapay-php is on Packagist."; exit 1
          fi
          if curl -fsS https://repo.packagist.org/p2/ketapay/ketapay-laravel.json 2>/dev/null | grep -qF -e "\"version\":\"v$version\"" -e "\"version\":\"$version\""; then
            echo "::error::ketapay/ketapay-laravel $version is already on Packagist."; exit 1
          fi
          { echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          echo "### Publishing ketapay/ketapay-laravel $version from \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Full CI on the release tag
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    name: Publish
    environment: publish # requires dudox's approval (repo settings > Environments)
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Infisical login
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: 'oidc'
          oidc-audience: 'https://infisical.com'
          identity-id: 'ef5c6cbd-0f7e-49a9-a6b7-8d115c2abbd2'
          project-slug: 'ketapay-sdks-pz5w' # one Infisical project for every KetaPay SDK
          env-slug: 'prod'
      - name: Ask Packagist to read the new tag
        run: |
          if [ -z "$PACKAGIST_TOKEN" ]; then echo "::error::PACKAGIST_TOKEN missing from Infisical prod"; exit 1; fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=ketapay&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/KetaPay/ketapay-laravel"}}'
      - name: Wait until Packagist lists the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://repo.packagist.org/p2/ketapay/ketapay-laravel.json?t=$(date +%s)" | grep -qF -e "\"version\":\"v$VERSION\"" -e "\"version\":\"$VERSION\""; then
              {
                echo "### Published ketapay/ketapay-laravel $VERSION"
                echo
                echo "Install: \`composer require ketapay/ketapay-laravel:$VERSION\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Packagist did not list $VERSION after 5 minutes. Check the package page."
          exit 1
