version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Conventional commit titles: the required PR title check accepts them, and chore keeps them out of
      # the changelog.
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Conventional commit titles: the required PR title check accepts them, and chore keeps them out of
      # the changelog.
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']
